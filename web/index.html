<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora do Simples Nacional</title>
    <meta
      name="description"
      content="Estimativa educativa da alíquota efetiva e do DAS do Simples Nacional, com a conta explicada passo a passo e as tabelas da Lei Complementar 123/2006."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#09090f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      As fontes começam a baixar junto com o HTML. Com o font-display: optional do
      estilo.css, a página não troca de fonte depois de aparecer (troca empurrava a
      calculadora para baixo: CLS de 0,103 no Lighthouse da CI).
    -->
    <link rel="preload" href="/fontes/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fontes/geist-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Tema salvo (claro ou escuro) antes de pintar a página: ver public/theme.js. -->
    <script src="/theme.js"></script>
    <!-- O endereço principal (o automático da Vercel é protegido) e a prévia do link
         quando alguém compartilha a página no WhatsApp, Slack ou LinkedIn. -->
    <link rel="canonical" href="https://simples-nacional-br.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://simples-nacional-br.vercel.app/" />
    <meta property="og:title" content="Calculadora do Simples Nacional" />
    <meta
      property="og:description"
      content="Estimativa educativa da alíquota efetiva e do DAS, com a conta explicada passo a passo e as tabelas da LC 123/2006."
    />
  </head>
  <body>
    <!-- No build, o marcador abaixo vira o HTML da página (ver scripts/prerender.mjs). -->
    <div id="root"><!--app--></div>
    <noscript><p class="erro">A calculadora precisa de JavaScript para funcionar.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
