    aliquota: "4.50"
    deduzir: "0.00"
    reparticao: { IRPJ: "18.80", CSLL: "15.20", Cofins: "17.67", PIS/Pasep: "3.83", ISS: "44.50" }
  - ate: "360000.00"
    aliquota: "9.00"
    deduzir: "8100.00"
    reparticao: { IRPJ: "19.80", CSLL: "15.20", Cofins: "20.55", PIS/Pasep: "4.45", ISS: "40.00" }
  - ate: "720000.00"
    aliquota: "10.20"
    deduzir: "12420.00"
    reparticao: { IRPJ: "20.80", CSLL: "15.20", Cofins: "19.73", PIS/Pasep: "4.27", ISS: "40.00" }
  - ate: "1800000.00"
    aliquota: "14.00"
    deduzir: "39780.00"
    reparticao: { IRPJ: "17.80", CSLL: "19.20", Cofins: "18.90", PIS/Pasep: "4.10", ISS: "40.00" }
  - ate: "3600000.00"
