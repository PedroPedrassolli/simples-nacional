    reparticao: { IRPJ: "18.80", CSLL: "19.20", Cofins: "18.08", PIS/Pasep: "3.92", ISS: "40.00" }
    teto_iss: { IRPJ: "31.33", CSLL: "32.00", Cofins: "30.13", PIS/Pasep: "6.54" }
