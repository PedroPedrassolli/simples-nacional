# Anexo I da Lei Complementar nº 123/2006.
# Título na lei: Alíquotas e Partilha do Simples Nacional – Comércio.
#
# Copiado do texto compilado no Planalto (link em "fonte"). No texto, o anexo tem a
# nota "Vide Lei Complementar nº 214, de 2025"; as alíquotas e as parcelas a deduzir
# continuam as da redação da Lei Complementar nº 155/2016. A LC 214/2025 (art. 519) troca
# esta tabela a partir de 1º/1/2027.
#
# Os valores ficam como texto e o Ruby converte para Rational (sem erro de
# arredondamento de Float). Cada faixa vai até "ate", inclusive.
#   aliquota: alíquota nominal, em %
#   deduzir:  parcela a deduzir, em R$
#   reparticao: percentual de cada tributo na alíquota efetiva (tabela "Percentual de
#               Repartição dos Tributos", logo abaixo das alíquotas no anexo). Soma 100%.
#               A 6ª faixa não tem ICMS nem ISS: eles são calculados com a 5ª faixa
#               (Resolução CGSN nº 140/2018, art. 21, III, b).
anexo: 1
nome: Comércio
fonte: https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp123.htm
redacao: Lei Complementar nº 155/2016
vigencia: "2018-01-01"
conferido_em: "2026-10-27"
faixas:
  - ate: "180000.00"
    aliquota: "4.00"
    deduzir: "0.00"
    reparticao: { IRPJ: "5.50", CSLL: "3.50", Cofins: "12.74", PIS/Pasep: "2.76", CPP: "41.50", ICMS: "34.00" }
