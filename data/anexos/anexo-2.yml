    aliquota: "4.50"
    deduzir: "0.00"
    reparticao: { IRPJ: "5.50", CSLL: "3.50", Cofins: "11.51", PIS/Pasep: "2.49", CPP: "37.50", IPI: "7.50", ICMS: "32.00" }
