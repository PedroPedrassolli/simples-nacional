# Anexo III da Lei Complementar nº 123/2006.
# Título na lei: Receitas de locação de bens móveis e de prestação de serviços não relacionados no § 5º-C do art. 18.
#
# Copiado do texto compilado no Planalto (link em "fonte"). No texto, o anexo tem a
# nota "Vide Lei Complementar nº 214, de 2025"; as alíquotas e as parcelas a deduzir
# continuam as da redação da Lei Complementar nº 155/2016. A LC 214/2025 (art. 519) troca
# esta tabela a partir de 1º/1/2027.
#
# Os valores ficam como texto e o Ruby converte para Rational (sem erro de
# arredondamento de Float). Cada faixa vai até "ate", inclusive.
#   aliquota: alíquota nominal, em %
#   deduzir:  parcela a deduzir, em R$
#   reparticao: percentual de cada tributo na alíquota efetiva (tabela "Percentual de
#               Repartição dos Tributos", logo abaixo das alíquotas no anexo). Soma 100%.
#               A 6ª faixa não tem ICMS nem ISS: eles são calculados com a 5ª faixa
#               (Resolução CGSN nº 140/2018, art. 21, III, b).
#   teto_iss:   nota (*) do anexo: "O percentual efetivo máximo devido ao ISS será de 5%,
#               transferindo-se a diferença, de forma proporcional, aos tributos federais".
#               Na 5ª faixa, com alíquota efetiva acima de 14,92537%, cada tributo federal
#               fica com (alíquota efetiva − 5%) × este percentual, e o ISS com 5%.
anexo: 3
nome: Locação de bens móveis e serviços não relacionados no § 5º-C do art. 18
fonte: https://www.planalto.gov.br/ccivil_03/leis/lcp/lcp123.htm
redacao: Lei Complementar nº 155/2016
vigencia: "2018-01-01"
conferido_em: "2026-10-27"
faixas:
  - ate: "180000.00"
    aliquota: "6.00"
    deduzir: "0.00"
    reparticao: { IRPJ: "4.00", CSLL: "3.50", Cofins: "12.82", PIS/Pasep: "2.78", CPP: "43.40", ISS: "33.50" }
  - ate: "360000.00"
    aliquota: "11.20"
    deduzir: "9360.00"
    reparticao: { IRPJ: "4.00", CSLL: "3.50", Cofins: "14.05", PIS/Pasep: "3.05", CPP: "43.40", ISS: "32.00" }
  - ate: "720000.00"
    aliquota: "13.50"
    deduzir: "17640.00"
    reparticao: { IRPJ: "4.00", CSLL: "3.50", Cofins: "13.64", PIS/Pasep: "2.96", CPP: "43.40", ISS: "32.50" }
  - ate: "1800000.00"
    aliquota: "16.00"
    deduzir: "35640.00"
    reparticao: { IRPJ: "4.00", CSLL: "3.50", Cofins: "13.64", PIS/Pasep: "2.96", CPP: "43.40", ISS: "32.50" }
  - ate: "3600000.00"
