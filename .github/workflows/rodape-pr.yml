# Tira do corpo dos PRs e dos comentários o rodapé que algumas ferramentas acrescentam
# sozinhas quando o texto é criado pela API ("Generated by [nome](link)" e o link da
# sessão), para ficar só o que foi escrito. A edição é feita com o GITHUB_TOKEN, então
# não dispara outros workflows.
#
# Custo: o job só roda quando o texto tem o rodapé (o "if" abaixo). Nos outros casos a
# execução aparece como pulada e não gasta minutos.
name: Rodapé dos PRs

on:
  pull_request:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  limpar:
    # Só PR do próprio repositório (em PR de fork o token não pode escrever) e só
    # comentário do dono do repositório.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.body, '/code/session_') ||
        contains(github.event.pull_request.body, 'Generated by [') ||
        contains(github.event.pull_request.body, 'Generated with ['))) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == github.repository_owner &&
       (contains(github.event.comment.body, '/code/session_') ||
        contains(github.event.comment.body, 'Generated by [') ||
        contains(github.event.comment.body, 'Generated with [')))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Tirar o rodapé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          COMENTARIO: ${{ github.event.comment.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
            caminho="repos/$GITHUB_REPOSITORY/issues/comments/$COMENTARIO"
          else
            caminho="repos/$GITHUB_REPOSITORY/pulls/$PR"
          fi
          gh api "$caminho" --jq '.body' > texto.md

          # Apaga as linhas do rodapé e, no fim do texto, os separadores "---" e as
          # linhas vazias que sobrarem.
          python3 - texto.md <<'PY'
          import re
          import sys

          caminho = sys.argv[1]
          with open(caminho, encoding="utf-8") as arquivo:
              linhas = arquivo.read().replace("\r\n", "\n").split("\n")
          rodape = re.compile(
              r"^[\W_]*Generated (by|with) \[[^\]]+\]\([^)]*\)[\W_]*$"  # "Generated by [nome](link)"
              r"|^\s*https://\S+/code/session_\S*\s*$"  # link da sessão numa linha sozinho
          )
          linhas = [linha for linha in linhas if not rodape.match(linha)]
          while linhas and re.fullmatch(r"\s*(-{3,})?\s*", linhas[-1]):
              linhas.pop()
          with open(caminho, "w", encoding="utf-8") as arquivo:
              arquivo.write("\n".join(linhas) + "\n")
          PY

          gh api -X PATCH "$caminho" -F body=@texto.md --silent
          echo "Rodapé tirado de $caminho."
