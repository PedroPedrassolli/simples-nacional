# O Dependabot abre PRs semanais atualizando as Actions dos workflows e os pacotes
# npm da página. A biblioteca Ruby não tem dependências, e as ferramentas de teste
# (Minitest, RuboCop...) já vêm sempre na versão mais nova na CI, porque o
# Gemfile.lock não é versionado.
#
# As Actions estão fixadas pelo commit (SHA) com a versão no comentário
# ("@3d3c42e... # v7.0.1"); o Dependabot atualiza os dois juntos.
# O grupo "actions" entra sozinho quando a CI passa (ver workflows/auto-merge.yml);
# os pacotes npm esperam revisão.
#
# Grupos por família: pacotes que dependem uns dos outros (ex.: eslint e @eslint/js;
# vite e @vitejs/plugin-react) sobem juntos, senão a CI falha por falta do par.
# cooldown: espera alguns dias antes de sugerir uma versão recém-lançada.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      vite:
        patterns: ["vite", "@vitejs/*"]
      eslint:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "globals"]
      react:
        patterns: ["react", "react-dom"]
      playwright:
        patterns: ["@playwright/*", "@axe-core/*"]
      fontes:
        patterns: ["@fontsource*"]
      patch:
        update-types: [patch]
      minor:
        update-types: [minor]
    commit-message:
      prefix: "deps(web)"
